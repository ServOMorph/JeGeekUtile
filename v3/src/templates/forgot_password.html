{% extends "base.html" %}

{% block title %}Mot de passe oublié — JeGeekUtile{% endblock %}

{% block content %}
<div class="form-container">
  <div class="form-box">
    <h1 class="form-box-title">RESET MDP</h1>
    <p class="form-box-desc">Réinitialise ton mot de passe</p>

    <p style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--mute); margin-bottom: 20px; line-height: 1.6;">
      Saisis ton email. Si le compte existe, un lien de réinitialisation te sera envoyé.
    </p>

    <form method="POST" action="{{ url_for('main.forgot_password') }}">
      <div class="form-group">
        <label class="form-label">Email</label>
        <div class="input-field">
          <span class="input-field-prefix">></span>
          <input type="email" name="email" placeholder="user@example.com" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 24px;">
        ENVOYER LIEN
      </button>
    </form>

    <div class="form-box-footer">
      <a href="{{ url_for('main.login') }}">Retour à la connexion</a>
    </div>
  </div>
</div>
{% endblock %}
