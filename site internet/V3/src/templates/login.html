{% extends "base.html" %}

{% block title %}Login — JeGeekUtile{% endblock %}

{% block content %}
<div class="form-container">
  <div class="form-box">
    <h1 class="form-box-title">LOGIN</h1>
    <p class="form-box-desc">Connecte-toi à ton compte</p>

    <form method="POST" action="{{ url_for('main.login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="form-group">
        <label class="form-label">Email</label>
        <div class="input-field">
          <span class="input-field-prefix">></span>
          <input type="email" name="email" placeholder="user@example.com" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-field">
          <span class="input-field-prefix">></span>
          <input type="password" name="password" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 24px;">
        CONNEXION
      </button>
    </form>

    <div class="form-box-footer">
      <a href="{{ url_for('main.forgot_password') }}">Mot de passe oublié ?</a>
    </div>
  </div>
</div>
{% endblock %}
