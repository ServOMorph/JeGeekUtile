{% extends "base.html" %}

{% block title %}Réinitialiser mot de passe — JeGeekUtile{% endblock %}

{% block content %}
<div class="form-container">
  <div class="form-box">
    <h1 class="form-box-title">NOUVEAU MDP</h1>
    <p class="form-box-desc">Crée un nouveau mot de passe</p>

    <form method="POST" action="{{ url_for('main.reset_password', token=token) }}" id="resetForm">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="token" value="{{ token }}">

      <div class="form-group">
        <label class="form-label">Nouveau mot de passe</label>
        <div class="input-field">
          <span class="input-field-prefix">></span>
          <input type="password" id="password" name="password" placeholder="••••••••" required minlength="8">
        </div>
        <small style="color: var(--dim); font-family: 'JetBrains Mono'; font-size: 11px; display: block; margin-top: 4px;">
          Minimum 8 caractères
        </small>
      </div>

      <div class="form-group">
        <label class="form-label">Confirmer mot de passe</label>
        <div class="input-field">
          <span class="input-field-prefix">></span>
          <input type="password" id="password_confirm" name="password_confirm" placeholder="••••••••" required minlength="8">
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 24px;">
        RÉINITIALISER
      </button>
    </form>

    <div class="form-box-footer">
      <a href="{{ url_for('main.login') }}">Retour à la connexion</a>
    </div>
  </div>
</div>

<script>
  document.getElementById('resetForm').addEventListener('submit', function(e) {
    const password = document.getElementById('password').value;
    const passwordConfirm = document.getElementById('password_confirm').value;

    if (password !== passwordConfirm) {
      e.preventDefault();
      alert('Les mots de passe ne correspondent pas.');
      return false;
    }

    if (password.length < 8) {
      e.preventDefault();
      alert('Le mot de passe doit contenir au moins 8 caractères.');
      return false;
    }
  });
</script>
{% endblock %}
