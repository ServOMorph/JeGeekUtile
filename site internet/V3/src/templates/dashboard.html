{% extends "base.html" %}

{% block title %}Dashboard — JeGeekUtile{% endblock %}

{% block extra_css %}
<style>
  .dashboard-hero {
    border-bottom: 1px solid var(--line);
    padding: 150px 80px 56px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(320px, 700px);
    gap: 48px;
    align-items: flex-start;
    position: relative;
    overflow: hidden;
    min-height: 550px;
  }

  .dashboard-intro {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    min-width: 0;
    padding-top: 20px;
  }

  .dashboard-title {
    font-family: var(--display);
    font-weight: 900;
    font-size: 94px;
    letter-spacing: -0.02em;
    color: var(--text);
    line-height: 0.95;
    text-align: left;
    margin: 0;
    max-width: 100%;
    overflow-wrap: anywhere;
  }

  .dashboard-user-info {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    margin-bottom: 8px;
  }

  .dashboard-eyebrow {
    font-family: var(--mono);
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.18em;
    color: var(--mute);
    text-transform: uppercase;
    margin-bottom: 18px;
  }

  .user-email-neon {
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(20px, 3vw, 38px);
    color: var(--neon);
    letter-spacing: 0.05em;
    text-shadow: 0 0 20px rgba(0,255,136,0.5), 0 0 40px rgba(0,255,136,0.25);
    margin: 0;
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  .dashboard-tagline {
    font-family: var(--mono);
    font-size: 16px;
    color: var(--mute);
    margin-top: 8px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .dashboard-info-panel {
    width: 100%;
    min-width: 0;
    min-height: 550px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  .dashboard-info-image {
    width: 100%;
    max-width: 700px;
    max-height: 550px;
    height: auto;
    object-fit: contain;
    display: block;
    opacity: 0.95;
    transition: opacity 0.3s ease;
  }

  .dashboard-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 48px;
    padding: 0 80px 80px;
    margin-top: -252px;
  }

  .dashboard-actions {
    display: flex;
    flex-direction: column;
    gap: 48px;
  }

  .projects-cta {
    margin-bottom: 60px;
  }

  .projects-button {
    font-size: 14px;
    padding: 16px 32px;
    letter-spacing: 0.1em;
    width: auto;
    max-width: 100%;
    text-align: center;
    justify-content: center;
  }

  @media (max-width: 1400px) {
    .dashboard-title {
      font-size: 100px;
    }

    .user-email-neon {
      font-size: 42px;
    }
  }

  @media (max-width: 1200px) {
    .dashboard-hero {
      padding: 132px 40px 56px;
      grid-template-columns: minmax(0, 1fr) minmax(260px, 420px);
    }

    .dashboard-title {
      font-size: 80px;
    }

    .user-email-neon {
      font-size: 32px;
    }

    .dashboard-grid {
      padding: 0 40px 60px;
    }
  }

  @media (max-width: 1024px) {
    .dashboard-hero {
      grid-template-columns: 1fr;
      gap: 32px;
      min-height: auto;
      padding: 124px 40px 40px;
    }

    .dashboard-intro,
    .dashboard-user-info {
      align-items: center;
      text-align: center;
    }

    .dashboard-title {
      text-align: center;
      font-size: 72px;
    }

    .dashboard-tagline {
      text-align: center;
    }

    .dashboard-info-panel {
      min-height: 360px;
    }

    .dashboard-info-image {
      max-height: 360px;
    }

    .dashboard-grid {
      margin-top: 0;
      padding: 0 40px 56px;
    }
  }

  @media (max-width: 768px) {
    .dashboard-hero {
      padding: 112px 20px 32px;
      gap: 24px;
    }

    .dashboard-title {
      font-size: clamp(40px, 12vw, 56px);
    }

    .user-email-neon {
      font-size: 24px;
      letter-spacing: 0.03em;
    }

    .dashboard-tagline {
      font-size: 13px;
      letter-spacing: 0.08em;
    }

    .dashboard-eyebrow {
      font-size: 13px;
      margin-bottom: 14px;
    }

    .dashboard-info-panel {
      min-height: 240px;
    }

    .dashboard-info-image {
      max-height: 240px;
    }

    .dashboard-grid {
      padding: 0 20px 40px;
    }

    .section-eyebrow {
      font-size: 14px;
      letter-spacing: 0.1em;
      margin-bottom: 18px;
    }

    .projects-cta {
      margin-bottom: 32px;
    }

    .projects-button {
      width: 100%;
      font-size: 13px;
      padding: 14px 18px;
      line-height: 1.4;
    }
  }
</style>
{% endblock %}

{% block content %}
<section class="dashboard-hero">
  <div class="dashboard-intro">
    <div class="dashboard-eyebrow">DASHBOARD</div>
    <div class="dashboard-user-info">
      <p class="user-email-neon">
        {{ user.email }}
      </p>
    </div>
    <h1 class="dashboard-title">
      JeGeekUtile
    </h1>
    <p class="dashboard-tagline">
      Future association loi 1901
    </p>
  </div>

  <div class="dashboard-info-panel">
    <img id="info-image" class="dashboard-info-image" src="/assets/info1.png" alt="Info">
  </div>
</section>

<div class="dashboard-grid">
  <div class="dashboard-actions">
    <div>
      <div class="section-eyebrow">PROJETS EN COURS DE DÉVELOPPEMENT</div>
      <div class="projects-cta">
        <button class="btn btn-primary projects-button" onclick="openProjects()">
          DÉCOUVRIR LES PROJETS & REJOINDRE LE DÉVELOPPEMENT
        </button>
      </div>
    </div>
  </div>
</div>

<script>
const infoImages = [
  'info1.png', 'info2.png', 'info3.png', 'info4.png',
  'info5.png', 'info6.png', 'info7.png', 'info8.png',
  'infojpg1.jpg', 'infojpg2.jpg', 'infojpg3.jpg', 'infojpg4.jpg',
  'infojpg5.jpg', 'infojpg6.jpg', 'infojpg7.jpg', 'infojpg8.jpg',
  'infojpg9.jpg', 'infojpg10.jpg', 'infojpg11.jpg', 'infojpg12.jpg'
];
let currentInfoIndex = 0;

function rotateInfoImage() {
  const img = document.getElementById('info-image');

  if (img && infoImages.length > 0) {
    currentInfoIndex = (currentInfoIndex + 1) % infoImages.length;
    const nextImage = infoImages[currentInfoIndex];
    img.style.opacity = '0';
    setTimeout(() => {
      img.src = `/assets/${nextImage}`;
      img.onload = () => { img.style.opacity = '0.95'; };
      img.onerror = function() {
        console.warn(`Image not found: ${nextImage}`);
        rotateInfoImage();
      };
    }, 300);
  }
}

setInterval(rotateInfoImage, 5000);
</script>
{% endblock %}
